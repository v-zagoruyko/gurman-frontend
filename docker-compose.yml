services:
  web:
    image: ${IMAGE}
    restart: unless-stopped
    mem_limit: 32m
    networks: [proxy]
    labels:
      - traefik.enable=true
      - traefik.http.routers.gurman.rule=Host(`xn----7sbblh9beecscegov.xn--p1ai`)
      - traefik.http.routers.gurman.entrypoints=websecure
      - traefik.http.routers.gurman.tls.certresolver=le
      - traefik.http.services.gurman.loadbalancer.server.port=80

networks:
  proxy:
    external: true
