server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;
  error_page 404 /404.html;
  absolute_redirect off;

  gzip on;
  gzip_comp_level 5;
  gzip_vary on;
  gzip_types text/css text/plain text/xml application/xml application/json application/javascript image/svg+xml image/x-icon;

  location / {
    try_files $uri $uri/ =404;
    add_header Cache-Control "no-cache";
  }

  location = /404.html {
    internal;
  }

  # the old single 26-page menu was split in two files
  location = /files/menu.pdf {
    return 301 /files/menu-banquet.pdf;
  }

  location /assets/ {
    expires 30d;
    add_header Cache-Control "public";
  }

  location /files/ {
    expires 7d;
    add_header Cache-Control "public";
  }
}
